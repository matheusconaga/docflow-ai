name: DocFlow AI CI/CD

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  ci:

    runs-on: ubuntu-latest

    steps:

      # CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # DOCKER BUILDX
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BUILD
      - name: Build Docker image
        run: |
          docker build -t docflow-ai .

      # LINT
      - name: Run Lint
        run: |
          docker run --rm \
          docflow-ai \
          flake8 app

      # UNIT TESTS
      - name: Run Unit Tests
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_TEST_URL }}" \
            docflow-ai \
            pytest tests/unit -v

      # INTEGRATION TESTS
      - name: Run Integration Tests
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_TEST_URL }}" \
            -v ${{ github.workspace }}/app/storage/uploads:/app/app/storage/uploads \
            docflow-ai \
            pytest tests/integration --cov=app -v

  deploy:

    needs: ci

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      # DEPLOY RENDER
      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  healthcheck:

    needs: deploy

    runs-on: ubuntu-latest

    steps:

      - name: Wait deployment
        run: sleep 120

      - name: API Health Check
        run: |
          curl --fail \
          --retry 10 \
          --retry-delay 10 \
          https://docflow-ai-lj3a.onrender.com/health